# scrobble-say config — copy to ~/.config/scrobble-say/config.toml and edit.
# Secrets do NOT go here; they live in 1Password and are read at runtime.

[lastfm]
username = "your-lastfm-username"

# Where to read the Last.fm API key from. (The shared secret isn't needed
# because we only call public read-only endpoints — no signed/auth calls.)
#   "op"   — read from 1Password (default; preferred). Requires the `op` CLI:
#            brew install --cask 1password-cli
#   "env"  — read from $LASTFM_API_KEY environment variable
secrets_source = "op"

# Only consulted if secrets_source = "op". Set to your 1Password item ID.
# Find it with:  op item list --vault Personal --format=json | jq '.[] | select(.title | test("Music"; "i"))'
op_vault = "Personal"
op_item_id = "REPLACE_WITH_OP_ITEM_ID"

[render]
# chafa target size for the cover grid (cols x rows of char cells).
size = "60x30"
# Grid shape. Accepts either N (= NxN) or "WxH".
#   grid = 3       → 3x3 = 9 covers (square)
#   grid = "10x2"  → 10 wide, 2 tall = 20 covers (wide banner)
#   grid = "1x9"   → single column of 9 covers (tall strip)
grid = 3
# Period passed to user.gettopalbums: 7day | 1month | 3month | 6month | 12month | overall
period = "7day"
# Output mode:
#   iterm    — raw PNG via iTerm2 inline-image protocol (pixel-perfect; default)
#   kitty    — raw PNG via kitty graphics protocol (kitty only)
#   sixels   — sixel-compatible terminals (mlterm, foot, recent xterm)
#   symbols  — chafa-stylised mix of block glyphs (broad terminal support, fast)
# Also override per-call with --format / --raw, or via $SCROBBLE_SAY_FORMAT.
# Tip: the cowsay-precmd snippet passes --format symbols explicitly for speed.
format = "iterm"
# Horizontal position in the terminal: left | center | right
position = "left"

[cache]
# Where to keep downloaded cover art + composed grids.
# Set to "" to disable on-disk caching.
dir = "~/.cache/scrobble-say"
# Re-fetch top-albums data after this many seconds (default: 1 day).
# The 1Password Touch ID prompt fires ONLY when this cache is stale —
# warm calls (within ttl_seconds) skip op entirely.
ttl_seconds = 86400
# Re-fetch --now (currently playing) after this many seconds (default: 30).
# Short because the playing track changes every few minutes.
now_ttl_seconds = 30
# Maximum size of the covers/ subdir in MB. Oldest-mtime files are LRU-evicted
# when the cap is exceeded. Each cover is ~100KB; 50MB ≈ 500 unique covers.
# Set to 0 to disable eviction (cache grows forever).
covers_max_mb = 50
