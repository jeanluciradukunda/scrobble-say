# Pre-commit hook: runs gitleaks on staged changes before every commit.
# Install with:  pre-commit install   (one-time per clone)
# Run manually:  pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # --staged limits the scan to what's about to be committed (fast).
        args: ["protect", "--staged", "--config", ".gitleaks.toml", "--verbose"]
